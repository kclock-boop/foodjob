[build]
  publish = "."
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
